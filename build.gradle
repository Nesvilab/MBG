plugins {
    // Apply the java plugin to add support for Java
    id 'java'
    // Apply the application plugin to add support for building a CLI application
    id 'application'
}

version '0.2.25'

repositories {
    mavenCentral()
    flatDir {
        dirs 'lib'
    }
}

jar {
    manifest {
        attributes(
                'Main-Class': 'com.mbg.MBG'
        )
    }
}

dependencies {
    implementation files("lib/batmass-io-1.35.4.jar")
    implementation files("lib/ptmshepherd-3.0.1-rc1.jar")
    implementation files("lib/IonQuant-1.11.10.jar")

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.7.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.7.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

application {
    // Define the main class for the application
    mainClassName = 'com.mbg.MBG'
}

test {
    useJUnitPlatform()
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = ['resources', 'src', 'test-resources']
            include "**/*.txt"
        }
    }
}

task packageNoDeps(group: 'mbg') {
    dependsOn 'clean'
    dependsOn 'jar'
    dependsOn 'test'
    tasks.findByName('jar').mustRunAfter 'clean'
    tasks.findByName('jar').mustRunAfter 'test'
}

task updateFragpipeJar(group: 'mbg') {
    dependsOn 'clean'
    dependsOn 'test'
    dependsOn 'jar'
    tasks.findByName('jar').mustRunAfter 'clean'
    tasks.findByName('jar').mustRunAfter 'test'
    doLast {
        String dest = "C:/Users/dpolasky/Repositories/FragPipe/MSFragger-GUI/tools"
//        String dest = "C:/Users/dpolasky/GitRepositories/FragPipe/FragPipe/MSFragger-GUI/build/install/fragpipe/tools"
        if (!file(dest).exists()) {
            println "ERROR: Destination directory does not exist: " + dest
        } else {
            copy {
                from "$buildDir/libs/"
                include "MBG*.jar"
                into file(dest)
            }
        }
    }
}